name: Wächter

# Prüft alle 20 Minuten von außen, ob der Scanner läuft und frische Daten auf der Website ankommen.
# Repariert selbst (hängende Läufe abbrechen, Scanner neu starten) und schickt nur dann eine Push-Nachricht,
# wenn das nicht hilft. Logik: waechter.py. Bewusst nicht zur vollen/halben Stunde (GitHub ist dann überlastet).
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: waechter
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: waechter.py
          sparse-checkout-cone-mode: false

      - name: Zustand laden
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: waechter_state
          key: waechter-${{ github.run_id }}
          restore-keys: waechter-

      - name: Prüfen und notfalls reparieren
        run: python3 waechter.py
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Zustand sichern
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: waechter_state
          key: waechter-${{ github.run_id }}
