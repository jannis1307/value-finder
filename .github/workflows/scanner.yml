name: Scanner

on:
  schedule:
    # Werktags alle 5 Minuten (kürzester Abstand, den GitHub erlaubt), ca. 7 bis 23 Uhr deutscher Zeit (Angabe in UTC).
    # Bewusst nicht zur vollen/halben Stunde: Dann ist GitHub überlastet und verschiebt oder verwirft Läufe.
    - cron: "2-57/5 6-21 * * 1-5"
    # Nachts (ca. 23–7 Uhr) jede halbe Stunde: Asien handelt, Krypto, US-Nachbörse – Ersatz, falls die Kette reißt
    - cron: "17,47 22-23,0-5 * * *"
    # Wochenende tagsüber stündlich (Krypto, Marktüberblick, Depot)
    - cron: "23 6-21 * * 0,6"
    # Lebenszeichen: GitHub schaltet Zeitpläne sonst nach 60 Tagen ohne Aktivität ab
    - cron: "41 4 * * 1"
  workflow_dispatch: # "Run workflow"-Knopf zum manuellen Starten

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  lebenszeichen:
    if: github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Zeitplan aktiv halten
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scanner.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  scan:
    if: github.event.schedule != '41 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      # Gespeicherte Kennzahlen + Alarm-Verlauf vom letzten Lauf wiederherstellen
      - name: Zwischenspeicher laden
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Markt scannen
        run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          PORTFOLIO_KEY_NEU: ${{ secrets.PORTFOLIO_KEY_NEU }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}

      - name: Zwischenspeicher sichern
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Neue Programmversion erzwingen (Browser-Cache)
        run: sed -i "s/plus\.js\"/plus.js?v=${{ github.run_id }}\"/; s/plus2\.js\"/plus2.js?v=${{ github.run_id }}\"/; s/plus3\.js\"/plus3.js?v=${{ github.run_id }}\"/; s/plus4\.js\"/plus4.js?v=${{ github.run_id }}\"/; s/plus5\.js\"/plus5.js?v=${{ github.run_id }}\"/; s/plus6\.js\"/plus6.js?v=${{ github.run_id }}\"/; s/app\.js\"/app.js?v=${{ github.run_id }}\"/" web/index.html

      - name: Website hochladen
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

      - name: Website veröffentlichen
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Kette: Jeder Lauf startet den nächsten selbst. So hängt die Aktualisierung nicht davon ab,
  # ob GitHub den Zeitplan oben pünktlich (oder überhaupt) ausführt.
  weiter:
    needs: scan
    if: always() && github.event.schedule != '41 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
    steps:
      - name: Nächsten Scan planen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WARTE=$(python3 - <<'PY'
          import datetime as dt
          n = dt.datetime.now(dt.timezone.utc)
          handel = lambda t: t.weekday() < 5 and 6 <= t.hour <= 21   # werktags ca. 7-23 Uhr deutscher Zeit
          wochenende = lambda t: t.weekday() >= 5 and 7 <= t.hour <= 21
          if handel(n):
              ziel = n + dt.timedelta(seconds=40)      # + Laufzeit (ca. 3 Min.) = etwa alle 3-4 Minuten
          elif wochenende(n):
              ziel = n + dt.timedelta(minutes=55)      # Wochenende tagsüber: etwa stündlich
          else:
              ziel = n + dt.timedelta(minutes=26)      # nachts: etwa jede halbe Stunde (Asien, Krypto, US-Nachbörse)
          print(int(max(0, min((ziel - n).total_seconds(), 5 * 3600 + 40 * 60))))
          PY
          )
          echo "Warte $WARTE Sekunden bis zum nächsten Scan"
          sleep "$WARTE"
          # Starten und prüfen, ob der neue Lauf wirklich angelegt wurde – sonst bis zu 5x erneut versuchen
          VORHER=$(gh run list --repo "${{ github.repository }}" --workflow scanner.yml --limit 1 --json databaseId -q '.[0].databaseId')
          for i in 1 2 3 4 5; do
            gh workflow run scanner.yml --repo "${{ github.repository }}" --ref main && sleep 15
            NEU=$(gh run list --repo "${{ github.repository }}" --workflow scanner.yml --limit 1 --json databaseId -q '.[0].databaseId')
            if [ -n "$NEU" ] && [ "$NEU" != "$VORHER" ]; then echo "Nächster Lauf gestartet: $NEU"; exit 0; fi
            echo "Noch kein neuer Lauf sichtbar, Versuch $i"; sleep $((i * 20))
          done
          echo "::warning::Nächster Lauf konnte nicht bestätigt werden"
