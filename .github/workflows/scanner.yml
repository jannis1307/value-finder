name: Scanner

on:
  schedule:
    # Werktags alle 5 Minuten (kürzester Abstand, den GitHub erlaubt), ca. 7 bis 23 Uhr deutscher Zeit (Angabe in UTC).
    # Bewusst nicht zur vollen/halben Stunde: Dann ist GitHub überlastet und verschiebt oder verwirft Läufe.
    - cron: "2-57/5 6-21 * * 1-5"
    # Wochenende: alle 2 Stunden (Krypto, Marktüberblick, Depot)
    - cron: "23 7-21/2 * * 0,6"
    # Lebenszeichen: GitHub schaltet Zeitpläne sonst nach 60 Tagen ohne Aktivität ab
    - cron: "41 4 * * 1"
  workflow_dispatch: # "Run workflow"-Knopf zum manuellen Starten

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  lebenszeichen:
    if: github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Zeitplan aktiv halten
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scanner.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  scan:
    if: github.event.schedule != '41 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      # Gespeicherte Kennzahlen + Alarm-Verlauf vom letzten Lauf wiederherstellen
      - name: Zwischenspeicher laden
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5

      - name: Markt scannen
        run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Zwischenspeicher sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Neue Programmversion erzwingen (Browser-Cache)
        run: sed -i "s/plus\.js\"/plus.js?v=${{ github.run_id }}\"/; s/plus2\.js\"/plus2.js?v=${{ github.run_id }}\"/; s/plus3\.js\"/plus3.js?v=${{ github.run_id }}\"/" web/index.html

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Website veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
